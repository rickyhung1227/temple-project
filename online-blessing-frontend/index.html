<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8e3e32">
  <title>線上祈福</title>

  <!-- 預先下載主要素材，減少手機與 LINE 內建瀏覽器切換時的等待。 -->
  <link rel="preload" as="image" href="images/blessing-background.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="image" href="images/blessing-title.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="image" href="images/jiaobei.webp" type="image/webp">
  <link rel="preload" as="image" href="images/jiaobei-front.webp" type="image/webp">
  <link rel="preload" as="image" href="images/jiaobei-back.webp" type="image/webp">
  <link rel="preload" as="image" href="images/wooden-fish.webp" type="image/webp">
  <link rel="preload" as="image" href="images/wooden-fish-stick.webp" type="image/webp">

  <link rel="stylesheet" href="style.css?v=3">
  <script src="script.js?v=2" defer></script>
</head>
<body>
  <main class="app" aria-label="線上祈福">
    <section class="blessing-stage">
      <img class="stage-background" src="images/blessing-background.webp" width="1530" height="2048" alt="" aria-hidden="true" loading="eager" decoding="async" fetchpriority="high">

      <header class="page-header">
        <img src="images/blessing-title.webp" width="960" height="116" alt="線上祈福" loading="eager" decoding="async">
      </header>

      <div id="blessingContent" class="blessing-content">
        <button id="backButton" class="back-button" type="button" hidden>
          <span aria-hidden="true">‹</span>返回
        </button>

        <div id="selectorView" class="selector-view">
          <h1 id="blessingName" class="blessing-name">擲筊</h1>

          <button id="previousButton" class="nav-button nav-button--previous" type="button" aria-label="上一個祈福方式">
            <span class="nav-button__icon" aria-hidden="true"></span>
          </button>

          <button id="activityButton" class="activity-button mode-jiaobei" type="button" aria-label="開始擲筊" data-mode="jiaobei">
            <img id="activityImage" class="activity-image" src="images/jiaobei.webp" width="1000" height="896" alt="兩個筊" loading="eager" decoding="async">
          </button>

          <button id="nextButton" class="nav-button nav-button--next" type="button" aria-label="下一個祈福方式">
            <span class="nav-button__icon" aria-hidden="true"></span>
          </button>

          <p class="interaction-hint">點擊圖片開始祈福</p>
          <div class="mode-indicators" aria-hidden="true">
            <span class="mode-indicator is-active"></span>
            <span class="mode-indicator"></span>
          </div>
          <p id="modeStatus" class="sr-only" aria-live="polite">目前選擇：擲筊</p>
        </div>

        <section id="jiaobeiView" class="feature-view jiaobei-view" aria-labelledby="jiaobeiTitle" hidden>
          <h1 id="jiaobeiTitle" class="feature-title">擲筊</h1>

          <div id="jiaobeiPair" class="jiaobei-pair" aria-label="兩個筊">
            <div id="leftJiaobei" class="jiaobei-piece jiaobei-piece--left">
              <img id="leftJiaobeiImage" src="images/jiaobei-front.webp" width="900" height="600" alt="左筊正面">
            </div>
            <div id="rightJiaobei" class="jiaobei-piece jiaobei-piece--right">
              <img id="rightJiaobeiImage" src="images/jiaobei-back.webp" width="900" height="600" alt="右筊反面">
            </div>
          </div>

          <p id="jiaobeiResult" class="jiaobei-result" aria-live="polite"></p>
          <button id="tossButton" class="action-button toss-button" type="button">
            <span id="tossButtonLabel">擲筊</span>
          </button>
        </section>

        <section id="woodenFishView" class="feature-view wooden-fish-view" aria-labelledby="meritLabel" hidden>
          <div class="merit-panel">
            <h1 id="meritLabel">功德</h1>
            <strong id="meritCount" aria-live="polite">0</strong>
          </div>

          <div class="muyu-scene">
            <button id="muyuButton" class="muyu-button" type="button" aria-label="敲木魚，累積功德">
              <img id="muyuImage" class="muyu-image" src="images/wooden-fish.webp" width="1100" height="964" alt="木魚">
            </button>
            <img id="muyuStick" class="muyu-stick" src="images/wooden-fish-stick.webp" width="950" height="633" alt="" aria-hidden="true">
            <div id="muyuEffects" class="muyu-effects" aria-hidden="true"></div>
          </div>

          <p class="muyu-hint">點擊木魚，累積功德</p>

          <!-- 日後放入 audio/muyu.mp3，再取消 source 的註解即可。 -->
          <audio id="muyuAudio" preload="auto">
            <source src="audio/muyu.mp3" type="audio/mpeg">
          </audio>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
